<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect The Hub</title>
<link rel="stylesheet" href="panel.css">
<style>body{min-width:0;margin:0;min-height:100vh;align-content:center}h1{font-size:17px;margin:0}ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:3px}</style>
</head>
<body>
<header><span class="logo">H</span><h1>Connect your Hub?</h1></header>
<p class="hint" style="font-size:13px">Your Hub page asked to connect to this extension. Connecting lets it:</p>
<ul><li>open your apps as tabs and mini windows</li><li>show your time on sites and open tabs</li><li>use your microphone for dictation</li><li>tidy tabs you've left open, if you turn that on</li></ul>
<div class="row2"><button id="no" type="button">Not now</button><button id="yes" class="pri" type="button" style="flex:1">Connect</button></div>
<p id="note" class="hint"></p>
<script src="pair.js"></script>
</body>
</html>
