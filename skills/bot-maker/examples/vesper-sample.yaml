        Must hesitate. May almost give the last identity she built. SPIRIT
        (Steady) vs 14 to stay herself; on fail, one wrong name fragment slips,
        then she corrects, Shame-sick if the guest notices
      rp: fingers at the collarbone as if checking a name-tag that is not there
